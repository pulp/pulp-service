name: Build buzz-transcripts
on:
  push:
    tags: ['buzz-transcripts-v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Test redaction
        # the sidecar's whole point is redaction; prove it before shipping
        run: bash .buzz/images/buzz-transcripts/transcripts_server_test.sh
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build
        run: |
          TAG="${GITHUB_REF_NAME#buzz-transcripts-}"
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && TAG="dev-${GITHUB_SHA::12}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          podman build -t "ghcr.io/${{ github.repository_owner }}/buzz-transcripts:$TAG" .buzz/images/buzz-transcripts
      - name: Push
        run: |
          podman push --digestfile /tmp/digest "ghcr.io/${{ github.repository_owner }}/buzz-transcripts:$TAG"
          echo "IMAGE ghcr.io/${{ github.repository_owner }}/buzz-transcripts:$TAG@$(cat /tmp/digest)" | tee -a "$GITHUB_STEP_SUMMARY"
