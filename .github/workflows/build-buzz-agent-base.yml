name: Build buzz-agent-base
on:
  push:
    tags: ['buzz-agent-base-v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Test the stop path
        # A turn in flight at a pod stop must get to finish; prove it before shipping.
        run: |
          bash .buzz/images/agent-base/agent-stop-hold_test.sh
          podman run --rm -v "$PWD/.buzz/images/agent-base:/t:ro" docker.io/library/alpine:3.20 sh -c \
            'apk add -q bash git jq python3 py3-yaml coreutils && bash /t/agent-entrypoint_stop_test.sh'
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build
        run: |
          TAG="${GITHUB_REF_NAME#buzz-agent-base-}"
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && TAG="dev-${GITHUB_SHA::12}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          podman build -t "ghcr.io/${{ github.repository_owner }}/buzz-agent-base:$TAG" .buzz/images/agent-base
      - name: Push
        run: |
          podman push --digestfile /tmp/digest "ghcr.io/${{ github.repository_owner }}/buzz-agent-base:$TAG"
          echo "IMAGE ghcr.io/${{ github.repository_owner }}/buzz-agent-base:$TAG@$(cat /tmp/digest)" | tee -a "$GITHUB_STEP_SUMMARY"
