# cos-rh, the Red Hat chief of staff, as an always on Buzz agent on OpenShift.
# Keys never live here: nsec and auth-tag come from Vault
# as the Secret agent-cos-rh. Runtime env the template still sets per target and
# NOT here: STAFF_CHANNEL, PENDING_ENV=/opt/agent/approval-check.env, AGENT_PUBKEY,
# the Vertex vars, AGENT_GIT_NAME/EMAIL, BUZZ_GIT_IDENTITY.
display_name: cos-rh
description: 'cos-rh, the Red Hat chief of staff: an AI agent (Claude).'
owner: gm-rh
# owner_pubkey matches the owner recorded for cos-rh on the RH relay (gm-rh),
# which is also the key that signed its auth-tag in Vault.
owner_pubkey: 6c6d64a0b90c4f1dbce52c14cf05f26cc4f2ab6233576c6a23cac7e157dbde93   # gm-rh
# Interim: one worker. buzz-acp has no thread-to-worker affinity, so parallelism
# above 1 lets several workers answer the same thread with contradictory results.
# Restore to 3 once the runtime does thread affinity plus single-flight per thread.
parallelism: 1
session_policy: thread
effort: medium
model: opus
relay: wss://buzz-rh.bouterse.casa
heartbeat_interval: 3600
respond_to: allowlist
