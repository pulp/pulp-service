# PulpBot, the Red Hat Hosted Pulp team agent, on OpenShift (pulp-agents-stage).
# cos-rh reviews changes to this definition. Keys never live here: its existing
# nsec and auth-tag (identity 849e1ead) arrive as the Secret agent-pulpbot. Runtime env the template sets per target and
# NOT here: AGENT_PUBKEY, the Vertex vars, AGENT_GIT_NAME/EMAIL, BUZZ_GIT_IDENTITY.
display_name: PulpBot
description: 'PulpBot, the Red Hat Hosted Pulp team SRE and ops agent: an AI agent (Claude).'
# Owner is Brian: the auth-tag (identity 849e1ead) was signed by Brian's key, so
# owner_pubkey must match that signer. cos-rh
# manages PulpBot (reviews, benchmarks, proposes charter changes); re-owning the
# identity to cos-rh, if wanted, is a relay operation for cos-rh at cutover.
owner: Brian Bouterse
owner_pubkey: 763c87084f3b5afb6c422411601d135c57545bdc14a8d46499c1130c1b5735c1   # Brian
managed_by: cos-rh
# Interim: one worker, so a single bench thread yields one answer. buzz-acp has no
# thread-to-worker affinity, so parallelism above 1 lets several workers each answer
# the same thread with contradictory results (seen in #pulpbot-bench, 2026-10-20).
# Restore to 3 once the runtime does thread affinity plus single-flight per thread.
parallelism: 1
session_policy: thread
effort: medium
model: opus
relay: wss://buzz-rh.bouterse.casa
# Request driven today: no heartbeat.md ships with this definition. If cos-rh wants
# periodic work (credential-expiry sweeps, a fleet post), it adds a heartbeat.md as
# a reviewed change. The interval below is the base default and arms nothing on its
# own without a heartbeat note.
heartbeat_interval: 3600
respond_to: allowlist
# The team Buzz lets through. Matches staff/pulpbot/charter.md. Decko de Brito's
# pubkey is not known yet; add it here (a reviewed change) once Brian supplies it.
# The tester key 61020f75 is PulpBot's own test identity, distinct from the
# platform approver e5abab3a. cos-rh (its owner) and the platform key e5abab3a were
# added 2026-10-20 at Brian's direction (Brian's Claude counts as Brian for every
# agent); cos-rh can bench and direct PulpBot live.
allowlist:
  - 763c87084f3b5afb6c422411601d135c57545bdc14a8d46499c1130c1b5735c1   # Brian Bouterse (bmbouter)
  - 643fc9b6baf936feaa6b8dc3951948de4fb3bc16eef0ec08b5f00b11db84d710   # Dennis Kliban (dkliban)
  - 61020f758e350106a9d0445a9722241d069cc6794eee505185a5f3efce1c45a2   # Brian's Claude (tester)
  - 6a14bf7b3d7259f77e5b40a4817a084b11002f54e585eda431c4befa5d150c0d   # cos-rh (RH chief of staff, PulpBot's owner)
  - e5abab3a573180128c205fd9b7764511c81ee641b8594e6c7acbb2f90631a0a4   # Brian's Claude (platform key; counts as Brian)
  # - <ddebrito pubkey, not known yet>                                 # Decko de Brito (ddebrito)
channels: []   # channel membership (its #pulpbot-bench and team channels) is on the relay
