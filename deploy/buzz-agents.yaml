apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: buzz-agent
  annotations:
    description: >-
      One always on Buzz agent (buzz-acp driving Claude Code through Vertex)
      whose definition lives in .buzz/agents/<slug> of a git repository and
      whose keys come from Vault as the Secret agent-<slug>. Rendered once per
      agent by app-interface's deploy-buzz-agents.yml SaaS file.
parameters:
- name: AGENT_SLUG
  required: true
- name: IMAGE
  value: ghcr.io/pulp/buzz-agent-base
- name: IMAGE_TAG
  required: true
- name: AGENT_DEFINITION_REPO
  value: https://github.com/pulp/pulp-service.git
- name: AGENT_DEFINITION_REF
  value: main
- name: CPU_REQUEST
  value: 250m
- name: CPU_LIMIT
  value: "1"
- name: MEMORY_REQUEST
  value: 1Gi
- name: MEMORY_LIMIT
  value: 2Gi
- name: STATE_SIZE
  value: 5Gi
- name: VERTEX_SECRET_NAME
  value: alcove-vertex-ai
- name: VERTEX_SECRET_KEY
  value: service-account.json
- name: VERTEX_PROJECT
  value: itpc-gcp-hosted-pulp
- name: VERTEX_REGION
  value: global
- name: HTTP_PROXY
  value: ""
- name: HTTPS_PROXY
  value: ""
- name: NO_PROXY
  value: "localhost,127.0.0.1,.svc,.cluster.local,10.128.0.0/14,172.30.0.0/16"
objects:
- apiVersion: v1
  kind: PersistentVolumeClaim
  metadata:
    name: buzz-agent-${AGENT_SLUG}-state
    labels:
      app: buzz-agent
      agent: ${AGENT_SLUG}
  spec:
    accessModes: [ReadWriteOnce]
    resources:
      requests:
        storage: ${STATE_SIZE}
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: buzz-agent-${AGENT_SLUG}
    labels:
      app: buzz-agent
      agent: ${AGENT_SLUG}
    annotations:
      qontract.recycle: "true"
  spec:
    replicas: 1
    strategy:
      type: Recreate
    selector:
      matchLabels:
        app: buzz-agent
        agent: ${AGENT_SLUG}
    template:
      metadata:
        labels:
          app: buzz-agent
          agent: ${AGENT_SLUG}
      spec:
        automountServiceAccountToken: false
        securityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        terminationGracePeriodSeconds: 120
        containers:
        - name: agent
          image: ${IMAGE}:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
          - name: AGENT_SLUG
            value: ${AGENT_SLUG}
          - name: AGENT_REVISION
            value: ${IMAGE_TAG}
          - name: AGENT_DEFINITION_REPO
            value: ${AGENT_DEFINITION_REPO}
          - name: AGENT_DEFINITION_REF
            value: ${AGENT_DEFINITION_REF}
          - name: AGENT_STATE_DIR
            value: /state
          - name: HOME
            value: /home/agent
          - name: KUBERNETES_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: CLAUDE_CODE_USE_VERTEX
            value: "1"
          - name: CLOUD_ML_REGION
            value: ${VERTEX_REGION}
          - name: ANTHROPIC_VERTEX_PROJECT_ID
            value: ${VERTEX_PROJECT}
          - name: GOOGLE_CLOUD_QUOTA_PROJECT
            value: ${VERTEX_PROJECT}
          - name: GOOGLE_APPLICATION_CREDENTIALS
            value: /run/secrets/vertex/${VERTEX_SECRET_KEY}
          - name: HTTP_PROXY
            value: ${HTTP_PROXY}
          - name: HTTPS_PROXY
            value: ${HTTPS_PROXY}
          - name: NO_PROXY
            value: ${NO_PROXY}
          - name: DISABLE_TELEMETRY
            value: "1"
          resources:
            requests:
              cpu: ${CPU_REQUEST}
              memory: ${MEMORY_REQUEST}
            limits:
              cpu: ${CPU_LIMIT}
              memory: ${MEMORY_LIMIT}
          volumeMounts:
          - name: state
            mountPath: /state
          - name: home
            mountPath: /home/agent
          - name: agent-secret
            mountPath: /run/secrets/agent
            readOnly: true
          - name: vertex
            mountPath: /run/secrets/vertex
            readOnly: true
        volumes:
        - name: state
          persistentVolumeClaim:
            claimName: buzz-agent-${AGENT_SLUG}-state
        - name: home
          emptyDir: {}
        - name: agent-secret
          secret:
            secretName: agent-${AGENT_SLUG}
            defaultMode: 0440
        - name: vertex
          secret:
            secretName: ${VERTEX_SECRET_NAME}
            defaultMode: 0440
