name: Akamai Report
description: |
  Analyzes 7-day Akamai traffic data via Sumo Logic and produces a formatted
  traffic report with LLM-driven analysis. Publishes HTML and JSON reports
  to GitLab Pages with a date-based index for historical browsing.
  Runs as a pre-compiled agent binary from GitHub Releases.

executable:
  url: https://github.com/pulp/pulp-service/releases/download/agent-akamai-report-20261109-198c394/agent-akamai-report
  args: ["--model", "claude-opus-4-6", "--gitlab-repo", "https://gitlab.cee.redhat.com/hosted-pulp/traffic-report"]
  env:
    GIT_SSL_NO_VERIFY: "true"

timeout: 1800
enforcement_mode: monitor

direct_outbound: true

credentials:
  SUMO_API_URL: SUMO_API_URL
  SUMO_ACCESS_ID: SUMO_ACCESS_ID
  SUMO_ACCESS_KEY: SUMO_ACCESS_KEY
  GITLAB_TOKEN: AKAMAI_REPORT_GITLAB_TOKEN

schedule:
  cron: "0 3 * * *"
  enabled: true
